name: Deploy to Reg.ru

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reg-ru-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Upload site files
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: server172.hosting.reg.ru
          username: ${{ secrets.REG_FTP_USERNAME }}
          password: ${{ secrets.REG_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./
          server-dir: /var/www/u3579695/data/www/djnizami.ru/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/*.zip
            **/.DS_Store